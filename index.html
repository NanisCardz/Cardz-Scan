<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Cardz Scan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#14213d;--panel:#1d2f55;--ink:#f4f6fb;--muted:#9fb0d0;--acc:#ffc233;--acc-ink:#14213d;--line:#34497a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
header img{width:44px;height:44px;border-radius:10px}
h1{font-size:1.4rem;margin:0}
header button{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:.9rem}
.scan{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--acc);color:var(--acc-ink);border:0;border-radius:16px;padding:18px;font-size:1.15rem;font-weight:700;cursor:pointer}
input[type=file]{display:none}
#preview{display:none;width:100%;max-height:260px;object-fit:contain;border-radius:14px;margin-top:16px;background:#0d1730}
#status{margin:16px 0;color:var(--muted);min-height:1.4em}
#status.err{color:#ff9b9b}
#result{display:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
dl{margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--muted)}dd{margin:0;font-weight:600;word-break:break-word}
.links{display:grid;gap:10px}
.links a{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:14px;font-weight:700}
.cm{background:var(--acc);color:var(--acc-ink)}
.gg{border:1px solid var(--line);color:var(--ink)}
#settings{display:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
#settings input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0d1730;color:var(--ink);font-size:1rem;margin:8px 0}
#settings button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
#settings p{margin:0;color:var(--muted);font-size:.9rem}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<main>
<header>
  <img src="icon-192.png" alt="">
  <h1>Cardz Scan</h1>
  <button id="cfgBtn" type="button">API-Key</button>
</header>

<section id="settings">
  <p>Dein Google-Gemini-API-Key wird nur auf diesem Gerät gespeichert.</p>
  <input id="key" type="password" placeholder="API-Key einfügen" autocomplete="off">
  <button id="saveKey" type="button">Speichern</button>
</section>

<button class="scan" id="scanBtn" type="button">📷 Produkt scannen</button>
<input id="file" type="file" accept="image/*" capture="environment">
<img id="preview" alt="Aufgenommenes Foto">
<div id="status" role="status">Foto von Karte oder Produkt aufnehmen.</div>

<section id="result">
  <dl>
    <dt>Name</dt><dd id="rName"></dd>
    <dt>Set</dt><dd id="rSet"></dd>
    <dt>Sprache</dt><dd id="rLang"></dd>
  </dl>
  <div class="links">
    <a class="cm" id="lCm" target="_blank" rel="noopener">Direkt auf Cardmarket</a>
    <a class="gg" id="lGg" target="_blank" rel="noopener">Über Google + Cardmarket</a>
  </div>
</section>
</main>

<script>
// Falls das Modell mal abgeschaltet wird: hier den Namen ändern.
var MODEL = "gemini-flash-latest";

var $ = function(id){ return document.getElementById(id); };
var KEY_NAME = "cardzscan_key";

function getKey(){ try { return localStorage.getItem(KEY_NAME) || ""; } catch(e){ return ""; } }
function setKey(v){ try { localStorage.setItem(KEY_NAME, v); } catch(e){} }
function status(t, err){ var s=$("status"); s.textContent=t; s.className = err ? "err" : ""; }

$("cfgBtn").onclick = function(){
  var s=$("settings"); s.style.display = s.style.display==="block" ? "none" : "block";
  $("key").value = getKey();
};
$("saveKey").onclick = function(){
  setKey($("key").value.trim());
  $("settings").style.display="none";
  status("Key gespeichert. Jetzt scannen.");
};
if(!getKey()){ $("settings").style.display="block"; status("Bitte zuerst deinen API-Key eintragen.", true); }

$("scanBtn").onclick = function(){
  if(!getKey()){ $("settings").style.display="block"; status("Bitte zuerst deinen API-Key eintragen.", true); return; }
  $("file").click();
};

// Bild verkleinern (spart Datenvolumen und beschleunigt die Erkennung)
function shrink(file){
  return new Promise(function(resolve, reject){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var data = c.toDataURL("image/jpeg",0.85);
      URL.revokeObjectURL(url);
      resolve(data);
    };
    img.onerror = function(){ reject(new Error("Bild konnte nicht gelesen werden.")); };
    img.src = url;
  });
}

var PROMPT = "Du bist Experte für Pokémon-Sammelkarten und -Produkte. Erkenne auf dem Foto das Produkt " +
  "(Einzelkarte oder Sealed-Produkt wie Top-Trainer-Box, Mini-Tin, Kollektion, Booster usw.). " +
  "Antworte ausschließlich als JSON mit den Feldern: " +
  "\"name\" (Produktname bzw. Kartenname inkl. Kartennummer, falls lesbar), " +
  "\"set\" (Name des Sets/der Erweiterung), " +
  "\"language\" (Sprache des Produkts, z. B. Deutsch, Englisch, Japanisch). " +
  "Wenn etwas nicht erkennbar ist, schreibe \"unbekannt\".";

$("file").onchange = async function(e){
  var f = e.target.files[0];
  if(!f) return;
  $("result").style.display="none";
  status("Erkenne Produkt …");
  try{
    var dataUrl = await shrink(f);
    var p = $("preview"); p.src = dataUrl; p.style.display="block";
    var b64 = dataUrl.split(",")[1];
    var models = [MODEL, "gemini-2.5-flash", "gemini-flash-lite-latest"];
    var res, json, done = false;
    for (var i = 0; i < models.length && !done; i++) {
      for (var t = 0; t < 2 && !done; t++) {
        if (i + t > 0) status("Server ausgelastet, neuer Versuch …");
        res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + models[i] + ":generateContent", {
          method:"POST",
          headers:{ "Content-Type":"application/json", "x-goog-api-key": getKey() },
          body: JSON.stringify({
            contents:[{ parts:[ {text:PROMPT}, {inline_data:{mime_type:"image/jpeg", data:b64}} ] }],
            generationConfig:{ responseMimeType:"application/json", temperature:0.1 }
          })
        });
        json = await res.json();
        if (res.ok) { done = true; }
        else if ([429,500,503,504].indexOf(res.status) === -1 && res.status !== 404) { break; }
        else { await new Promise(function(r){ setTimeout(r, 1500); }); }
      }
      if (!done && res && [429,500,503,504,404].indexOf(res.status) === -1) break;
    }
    if(!res.ok){
      var m = (json.error && json.error.message) || ("Fehler " + res.status);
      throw new Error(m);
    }
    var txt = json.candidates[0].content.parts.map(function(x){return x.text||"";}).join("");
    var d = JSON.parse(txt.replace(/```json|```/g,"").trim());
    show(d);
    status("");
  }catch(err){
    status("Erkennung fehlgeschlagen: " + err.message, true);
  }
  e.target.value = "";
};

function show(d){
  var name = d.name || "unbekannt", set = d.set || "unbekannt", lang = d.language || "unbekannt";
  $("rName").textContent = name; $("rSet").textContent = set; $("rLang").textContent = lang;
  var q = [name, set].filter(function(x){return x && x!=="unbekannt";}).join(" ");
  $("lCm").href = "https://www.cardmarket.com/de/Pokemon/Products/Search?searchString=" + encodeURIComponent(q);
  $("lGg").href = "https://www.google.com/search?q=" + encodeURIComponent(q + " cardmarket");
  $("result").style.display="block";
}

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
</script>
</body>
</html>
